<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Cinematic film clapboard</title>
  <desc id="desc">A large film clapboard centered against warm studio lighting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d10"/>
      <stop offset="0.48" stop-color="#251a1b"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#f4c77d" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#e9ae59" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e9ae59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303037"/>
      <stop offset="1" stop-color="#0a0d10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="clapper-stripes">
      <rect x="190" y="188" width="720" height="104" rx="8"/>
    </clipPath>
  </defs>

  <rect width="1100" height="760" fill="url(#bg)"/>
  <ellipse cx="550" cy="235" rx="475" ry="310" fill="url(#glow)"/>
  <path d="M0 625c190-54 385-70 565-54 201 17 375 59 535 122v67H0z" fill="#100d10"/>
  <path d="M0 668c173-34 354-43 532-28 213 19 400 54 568 103" fill="none" stroke="#e9b66c" stroke-opacity="0.16" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="190" y="274" width="720" height="352" rx="18" fill="url(#board)" stroke="#aaa3a2" stroke-opacity="0.75" stroke-width="6"/>
    <rect x="205" y="289" width="690" height="322" rx="10" fill="#111317" stroke="#ff334e" stroke-opacity="0.55" stroke-width="3"/>

    <g clip-path="url(#clapper-stripes)">
      <rect x="190" y="188" width="720" height="104" fill="#eee7dc"/>
      <path d="M230 188h82l-60 104h-82zm164 0h82l-60 104h-82zm164 0h82l-60 104h-82zm164 0h82l-60 104h-82zm164 0h82l-60 104h-82z" fill="#151519"/>
    </g>
    <path d="M190 290h720" stroke="#ff334e" stroke-width="7"/>
    <circle cx="205" cy="290" r="10" fill="#ff334e"/>
    <circle cx="895" cy="290" r="10" fill="#ff334e"/>

    <text x="550" y="402" fill="#f4f0f0" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="10" text-anchor="middle">DIRECTOR</text>
    <path d="M270 430h560" stroke="#9a9699" stroke-opacity="0.7" stroke-width="4"/>
    <text x="310" y="490" fill="#ff5267" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="6">SCENE</text>
    <text x="520" y="490" fill="#ff5267" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="6">TAKE</text>
    <text x="710" y="490" fill="#ff5267" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="6">ROLL</text>
    <path d="M300 514h150M510 514h120M700 514h120" stroke="#dfe0e1" stroke-opacity="0.75" stroke-width="4"/>
    <path d="M270 558h560" stroke="#77767b" stroke-opacity="0.55" stroke-width="3"/>
    <text x="550" y="590" fill="#f3d3a1" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="8" text-anchor="middle">STUDIO DREAMERS PICTURES</text>
  </g>
</svg>
