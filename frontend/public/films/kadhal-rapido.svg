<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" role="img" aria-labelledby="title desc">
  <title id="title">Kadhal Rapido</title>
  <desc id="desc">A red heart pierced by an arrow above the title Kadhal Rapido.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#240c18"/>
      <stop offset=".52" stop-color="#57172e"/>
      <stop offset="1" stop-color="#100b12"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#ff416d" stop-opacity=".48"/>
      <stop offset="1" stop-color="#ff416d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1=".15" y1="0" x2=".8" y2="1">
      <stop stop-color="#ff8398"/>
      <stop offset=".5" stop-color="#fa315d"/>
      <stop offset="1" stop-color="#a90d3c"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="900" height="1350" fill="url(#background)"/>
  <ellipse cx="450" cy="630" rx="420" ry="430" fill="url(#glow)"/>
  <circle cx="450" cy="580" r="190" fill="#ff315e" opacity=".18" filter="url(#shadow)"/>
  <path d="M450 792 244 588C105 451 298 269 450 420c152-151 345 31 206 168z" fill="url(#heart)" stroke="#ffb0bd" stroke-opacity=".65" stroke-width="8"/>
  <path d="m237 681 412-286" fill="none" stroke="#ffe6c5" stroke-width="13" stroke-linecap="round"/>
  <path d="m632 383 76-13-31 69-8-34z" fill="#ffe6c5"/>
  <path d="m252 671-41 59 70-23" fill="none" stroke="#ffe6c5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m343 531 22 22m-76 58 22 22m171-158 22 22" stroke="#fff4ed" stroke-opacity=".6" stroke-width="7" stroke-linecap="round"/>
  <text x="450" y="126" fill="#fff" fill-opacity=".68" font-family="Arial, sans-serif" font-size="18" letter-spacing="8" text-anchor="middle">A STUDIO DREAMERS PICTURES FILM</text>
  <text x="450" y="1115" fill="#fff" font-family="Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="5" text-anchor="middle">KADHAL</text>
  <text x="450" y="1200" fill="#ff8398" font-family="Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="5" text-anchor="middle">RAPIDO</text>
  <text x="450" y="1260" fill="#fff" fill-opacity=".68" font-family="Arial, sans-serif" font-size="17" letter-spacing="7" text-anchor="middle">LOVE AT FULL SPEED</text>
</svg>
